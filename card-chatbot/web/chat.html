<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카드 혜택 계산기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#F5F6F1;
    --surface:#FFFFFF;
    --surface-2:#EEF1EA;
    --ink:#12201B;
    --ink-soft:#4B5A53;
    --ink-faint:#7C897F;
    --accent:#2F6F4E;
    --accent-strong:#1F5038;
    --accent-ink:#FBFCF9;
    --accent-soft:#E2EEE6;
    --gold:#A87B1E;
    --gold-soft:#F6EDD6;
    --ok:#2F6F4E;
    --danger:#B84A3E;
    --danger-soft:#F6E3E0;
    --line:#DDE3D9;
    --shadow: 0 1px 2px rgba(18,32,27,0.04), 0 12px 32px -16px rgba(18,32,27,0.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1613; --surface:#161F1A; --surface-2:#1D2721;
      --ink:#EAF0EC; --ink-soft:#A9B6AF; --ink-faint:#75847B;
      --accent:#6FCF9A; --accent-strong:#8CDBAE; --accent-ink:#0F1613; --accent-soft:#1F3328;
      --gold:#E3B95C; --gold-soft:#3A3020;
      --ok:#6FCF9A; --danger:#E08578; --danger-soft:#3A2321; --line:#293630;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 20px 40px -20px rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1613; --surface:#161F1A; --surface-2:#1D2721;
    --ink:#EAF0EC; --ink-soft:#A9B6AF; --ink-faint:#75847B;
    --accent:#6FCF9A; --accent-strong:#8CDBAE; --accent-ink:#0F1613; --accent-soft:#1F3328;
    --gold:#E3B95C; --gold-soft:#3A3020;
    --ok:#6FCF9A; --danger:#E08578; --danger-soft:#3A2321; --line:#293630;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 20px 40px -20px rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans KR', -apple-system, sans-serif; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums;}
  button, input, select{font-family:inherit;}

  .app{
    max-width:1180px; margin:0 auto; padding:28px 20px; height:100vh;
    display:grid; grid-template-columns:340px 1fr; grid-template-rows:auto 1fr; gap:16px;
  }
  .top{grid-column:1 / -1; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .top h1{font-size:22px; margin:0; font-weight:700; letter-spacing:-0.01em; white-space:nowrap;}
  .chip{
    white-space:nowrap;
    font-family:'IBM Plex Mono'; font-size:11.5px; font-weight:600; color:var(--accent-strong);
    background:var(--surface-2); border:1px solid var(--line); padding:2px 8px; border-radius:6px;
  }
  .spacer{flex:1;}
  .icon-btn{
    white-space:nowrap;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer;
    border-radius:9px; padding:7px 11px; font-size:13px;
  }
  .icon-btn:hover{color:var(--ink);}

  .panel, .chat{
    background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
    overflow:hidden; display:flex; flex-direction:column; min-height:0;
  }
  .panel-head{padding:16px 18px 12px; border-bottom:1px solid var(--line);}
  .panel-head h2{font-size:15px; margin:0 0 2px;}
  .panel-head p{font-size:12.5px; color:var(--ink-faint); margin:0;}
  .fill-btn{margin-top:8px; font-size:12px; padding:5px 10px;}
  .card-list{overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px;}
  .group-head{
    display:flex; align-items:center; gap:6px; margin:6px 2px 0; font-size:12px; font-weight:600; color:var(--ink-soft);
  }
  .group-head:first-child{margin-top:0;}
  .group-head .count{font-weight:500; color:var(--ink-faint);}
  .type{
    display:inline-block; font-size:10.5px; font-weight:600; padding:1px 6px; border-radius:5px; vertical-align:1px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink-soft);
  }
  .type.check{color:var(--accent-strong); border-color:var(--accent); background:var(--accent-soft);}
  .type.credit{color:var(--gold); border-color:var(--gold); background:var(--gold-soft);}

  .mycard{border:1px solid var(--line); border-radius:12px; background:var(--surface);}
  .mycard.on{border-color:var(--accent); background:var(--accent-soft);}
  .mycard-head{display:flex; align-items:flex-start; gap:10px; padding:10px 12px 8px;}
  .mycard-pick{display:flex; padding:2px 0; cursor:pointer;}
  .mycard-pick input{margin:0; width:16px; height:16px; accent-color:var(--accent); cursor:pointer;}
  .mycard-info{flex:1; min-width:0; cursor:pointer;}
  .mycard-name{font-size:13.5px; font-weight:600;}
  .mycard-sub{font-size:11.5px; color:var(--ink-faint);}
  .mycard-summary{font-size:11.5px; color:var(--ink-soft); margin-top:4px; font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums;}
  .mycard.on .mycard-summary{color:var(--accent-strong);}
  .mycard-body{padding:4px 12px 12px 38px; display:none; flex-direction:column; gap:8px;}
  .mycard.open .mycard-body{display:flex;}
  .expand-btn{
    display:flex; align-items:center; justify-content:center; gap:5px; width:100%;
    border:none; border-top:1px solid var(--line); background:transparent; color:var(--ink-soft);
    font-size:12px; padding:6px 10px; cursor:pointer; border-radius:0 0 11px 11px;
  }
  .expand-btn:hover{background:var(--surface-2); color:var(--ink);}
  .expand-btn .arrow{display:inline-block; transition:transform .15s ease;}
  .mycard.open .expand-btn .arrow{transform:rotate(180deg);}
  .mycard.open .expand-btn{border-top-style:dashed;}
  .field{display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--ink-soft);}
  .field.inline{flex-direction:row; align-items:center; gap:6px;}
  .num{display:flex; align-items:center; gap:5px;}
  .num input, .field select{
    width:100%; padding:6px 8px; border-radius:7px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:13px;
  }
  .num input{font-family:'IBM Plex Mono'; text-align:right; font-variant-numeric:tabular-nums;}
  .num span{font-size:12px; color:var(--ink-faint); white-space:nowrap;}
  input:focus, select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  details.usage{border-top:1px dashed var(--line); padding-top:6px;}
  details.usage summary{font-size:12px; color:var(--ink-soft); cursor:pointer;}
  details.usage .field{margin-top:6px;}

  .chat{min-height:0;}
  #log{flex:1; overflow-y:auto; padding:20px 22px; display:flex; flex-direction:column; gap:14px;}
  .msg{max-width:88%; padding:10px 14px; border-radius:12px; font-size:14.5px; white-space:pre-wrap; word-break:break-word;}
  .msg.user{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px;}
  .msg.bot{align-self:flex-start; background:var(--surface-2); border:1px solid var(--line); border-bottom-left-radius:4px;}
  .msg.error{color:var(--danger);}
  .msg.typing{color:var(--ink-faint);}
  .followup{display:block; font-size:12px; color:var(--ink-faint); margin-bottom:4px;}
  .bot-wrap{align-self:stretch; display:flex; flex-direction:column; gap:10px; max-width:100%;}
  .bot-wrap .msg{max-width:88%;}

  .results{display:grid; gap:8px;}
  .result{border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:12px 14px;}
  .result.first{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset;}
  .result-row{display:flex; align-items:center; gap:10px;}
  .rank{
    width:26px; height:26px; border-radius:50%; display:grid; place-items:center; flex:none;
    font-family:'IBM Plex Mono'; font-size:13px; font-weight:600;
    background:var(--surface-2); color:var(--ink-soft);
  }
  .result.first .rank{background:var(--gold-soft); color:var(--gold);}
  .result-name{font-weight:600; font-size:14px;}
  .result-benefit{font-size:12.5px; color:var(--ink-soft);}
  .result-value{margin-left:auto; font-size:18px; font-weight:600; white-space:nowrap;}
  .result-value.zero{color:var(--ink-faint); font-size:15px;}
  .result details{margin-top:8px;}
  .result summary{font-size:12.5px; color:var(--accent-strong); cursor:pointer;}
  .steps{list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:4px;}
  .steps li{display:grid; grid-template-columns:18px 112px 1fr; gap:6px; font-size:12.5px; align-items:baseline;}
  .steps .mark{font-weight:700; text-align:center;}
  .steps .mark.ok{color:var(--ok);}
  .steps .mark.no{color:var(--danger);}
  .steps .mark.info{color:var(--ink-faint);}
  .steps .label{color:var(--ink-soft);}
  .steps .src{display:block; font-size:11px; color:var(--ink-faint);}
  .why-not{font-size:12px; color:var(--ink-soft); margin:6px 0 0; padding-left:16px;}
  .benefit-title{font-size:12.5px; font-weight:600; margin-top:10px;}

  /* 이 카드를 썼나요? */
  .use-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; padding-top:8px;
    border-top:1px dashed var(--line); font-size:12.5px; color:var(--ink-soft);}
  .use-row button{
    border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent-strong); cursor:pointer;
    border-radius:999px; padding:4px 12px; font-size:12.5px; font-weight:600;
  }
  .use-row button.undo{border-color:var(--line); background:var(--surface); color:var(--ink-soft); font-weight:500;}
  .use-row .done{color:var(--accent-strong); font-weight:600;}
  .use-row .hint{flex-basis:100%; font-size:11.5px; color:var(--ink-faint);}

  /* 이번 달 결제 기록 */
  .history{border-top:1px solid var(--line); padding:10px 14px 12px; max-height:34vh; overflow-y:auto; flex:none;}
  .history h3{font-size:13px; margin:0 0 6px; display:flex; align-items:center; gap:6px;}
  .history .note{font-size:11.5px; color:var(--ink-faint); margin:0 0 6px;}
  .history ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}
  .history li{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-soft);}
  .history li .what{flex:1; min-width:0;}
  .history li .what b{color:var(--ink); font-weight:600;}
  .history li button{border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer;
    border-radius:7px; padding:2px 8px; font-size:11.5px; white-space:nowrap;}
  .history li button:hover{color:var(--danger); border-color:var(--danger);}
  .history .empty-note{font-size:12px; color:var(--ink-faint);}

  .suggest{border:1px dashed var(--gold); background:var(--gold-soft); border-radius:12px; padding:10px 14px;}
  .suggest h3{font-size:13px; margin:0 0 4px; color:var(--gold);}
  .suggest ul{margin:0; padding-left:18px; font-size:13px;}
  .meta-note{font-size:11.5px; color:var(--ink-faint);}

  .empty{margin:auto; text-align:center; color:var(--ink-faint); font-size:13.5px; max-width:420px;}
  .examples{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px;}
  .examples button{
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink-soft); cursor:pointer;
    border-radius:999px; padding:5px 11px; font-size:12.5px;
  }
  .examples button:hover{color:var(--ink); border-color:var(--accent);}

  form{display:flex; gap:8px; padding:14px 22px 18px; border-top:1px solid var(--line); align-items:center;}
  /* 질문 연결: 자동 / 이어서 / 새 질문 */
  .link{display:flex; flex-direction:column; gap:2px; flex:none;}
  .link-label{font-size:10.5px; color:var(--ink-faint); padding-left:2px;}
  .link-opts{display:flex; padding:2px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line);}
  .link-opts button{
    border:none; background:transparent; color:var(--ink-soft); cursor:pointer;
    padding:3px 8px; border-radius:6px; font-size:11.5px; white-space:nowrap;
  }
  .link-opts button:hover{color:var(--ink);}
  .link-opts button[aria-checked="true"]{background:var(--surface); color:var(--accent-strong); font-weight:600;
    box-shadow:0 1px 2px rgba(0,0,0,0.12);}
  #q{
    flex:1; padding:11px 13px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:14.5px;
  }
  .send-btn{
    cursor:pointer; border:none; background:var(--accent); color:var(--accent-ink); font-weight:600; font-size:14.5px;
    padding:11px 18px; border-radius:9px; white-space:nowrap; transition:transform .12s ease;
  }
  .send-btn:hover{transform:translateY(-1px);}
  .send-btn:disabled{opacity:.5; cursor:default; transform:none;}

  /* 카드 탭 열고 닫기 */
  .app.panel-closed{grid-template-columns:1fr;}
  .app.panel-closed .panel{display:none;}
  .tab-btn[aria-pressed="true"]{border-color:var(--accent); color:var(--accent-strong); background:var(--accent-soft);}
  .tab-btn .n{font-family:'IBM Plex Mono'; font-size:11.5px; margin-left:4px;}
  .panel-title{display:flex; align-items:center; gap:8px;}
  .close-btn{margin-left:auto; padding:4px 9px; font-size:13px; line-height:1;}

  /* 체크/신용 종류 탭 */
  .tabs{display:flex; gap:3px; margin-top:10px; padding:3px; border-radius:9px; background:var(--surface-2); border:1px solid var(--line);}
  .tabs button{
    flex:1; border:none; background:transparent; color:var(--ink-soft); cursor:pointer;
    padding:6px 4px; border-radius:7px; font-size:12.5px; white-space:nowrap;
  }
  .tabs button:hover{color:var(--ink);}
  .tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,0.12);}
  .tabs .n{font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-faint); margin-left:3px;}

  /* 한 번에 선택 */
  .quick{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:10px;}
  .quick-label{font-size:12px; color:var(--ink-faint); margin-right:2px;}
  .quick button{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer;
    border-radius:999px; padding:4px 10px; font-size:12px; white-space:nowrap;
  }
  .quick button:hover{color:var(--ink); border-color:var(--accent);}
  .quick button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong); font-weight:600;}

  @media (max-width:860px){
    .app{grid-template-columns:1fr; grid-template-rows:auto auto 1fr; padding:12px 16px; height:auto; min-height:100vh;}
    .top{gap:8px;}
    .top h1{font-size:18px;}
    .panel{max-height:none;}
    .card-list{max-height:60vh;}
    .chat{min-height:70vh;}
    #log{padding:16px;}
    form{padding:12px 16px 16px; flex-wrap:wrap;}
    .link{flex-basis:100%; flex-direction:row; align-items:center; gap:8px;}
    #q{min-width:0;}
    .steps li{grid-template-columns:18px 90px 1fr;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <h1>카드 혜택 계산기</h1>
    <span class="chip" id="mode">연결 중</span>
    <span class="spacer"></span>
    <button class="icon-btn tab-btn" id="panelTab" type="button" aria-controls="panel" aria-pressed="true">
      내 카드<span class="n" id="ownedCountTop"></span></button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="테마 바꾸기">테마</button>
  </div>

  <section class="panel" id="panel">
    <div class="panel-head">
      <div class="panel-title">
        <h2>내 카드 <span class="chip" id="ownedCount">0장</span></h2>
        <button class="icon-btn close-btn" id="panelClose" type="button" aria-label="카드 탭 닫기" title="카드 탭 닫기">✕</button>
      </div>
      <p>가진 카드를 고르면 그 카드들로만 계산해요. 전월 실적은 혜택을 모두 받는 최고 구간으로 채워 두었어요.</p>
      <button class="icon-btn fill-btn" id="fillBtn" type="button">전월 실적 최고 구간으로 채우기</button>
      <div class="quick" id="quickPick" role="group" aria-label="카드 한 번에 선택"></div>
      <div class="tabs" id="typeTabs" role="tablist" aria-label="카드 종류"></div>
    </div>
    <div class="card-list" id="cardList"></div>
    <div class="history" id="history" aria-live="polite"></div>
  </section>

  <section class="chat">
    <div id="log" aria-live="polite">
      <div class="empty" id="emptyMsg">
        결제할 곳과 금액을 물어보세요. 상위 3개 카드와 계산 근거를 보여드려요.
        <div class="examples" id="examples"></div>
      </div>
    </div>
    <form id="chatForm">
      <div class="link">
        <span class="link-label" id="linkLabel">질문 연결</span>
        <div class="link-opts" id="linkOpts" role="radiogroup" aria-labelledby="linkLabel"></div>
      </div>
      <input type="text" id="q" placeholder="예) 스벅 15000원, 토요일 이마트 6만원" autocomplete="off" maxlength="300">
      <button type="submit" class="send-btn" id="sendBtn">보내기</button>
    </form>
  </section>
</div>

<script>
(function(){
  var STORE = 'card-chatbot-profile-v2', THEME = 'card-chatbot-theme', OPEN = 'card-chatbot-open',
      PANEL = 'card-chatbot-panel', TAB = 'card-chatbot-tab';
  var EXAMPLES = ['스벅 15000원', '그럼 9000원이면?', '체크카드 중에 편의점 12000원', '토요일 이마트 6만원', '밤 11시 택시 9000원',
                  '주유소 8만원 50리터', '아파트관리비 실적에 들어가?', '올바른 혜택 알려줘'];
  var log = document.getElementById('log'), input = document.getElementById('q');
  var sendBtn = document.getElementById('sendBtn'), list = document.getElementById('cardList');
  var cards = [], profile = load(), context = null, busy = false;
  var openCards = [];
  try { openCards = JSON.parse(localStorage.getItem(OPEN)) || []; } catch(e){}

  function load(){
    try { return JSON.parse(localStorage.getItem(STORE)) || {owned: [], cards: {}}; }
    catch(e){ return {owned: [], cards: {}}; }
  }
  function save(){ try { localStorage.setItem(STORE, JSON.stringify(profile)); } catch(e){} }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function won(n, unit){ return Number(n || 0).toLocaleString('ko-KR') + (unit || '원'); }
  function cardState(id){
    profile.cards[id] = profile.cards[id] || {prev_month: fullOf(id), options: {}, used_groups: {}, used_benefits: {}};
    return profile.cards[id];
  }
  function fullOf(id){
    var c = cards.filter(function(x){ return x.id === id; })[0];
    return c ? c.full_prev_month : 0;
  }
  function fillFull(){
    cards.forEach(function(c){ cardState(c.id).prev_month = c.full_prev_month; });
    profile.prefilled = true; save(); renderCards();
  }

  // ---------- 사용 기록: '썼어요'를 누르면 서버(엔진)가 계산해 준 사용량을 그대로 더해요 ----------
  function ymd(d){ var z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
  function rollover(){
    // 달이 바뀌면 이번 달 사용량을, 날이 바뀌면 오늘 횟수를 0으로 (처음 쓰는 경우엔 기존 입력값을 지우지 않아요)
    var day = ymd(new Date()), month = day.slice(0, 7), changed = false;
    if (profile.usage_month && profile.usage_month !== month){
      var keepYear = profile.usage_month.slice(0, 4) === month.slice(0, 4);
      Object.keys(profile.cards).forEach(function(id){
        var st = profile.cards[id];
        st.used_groups = {};
        Object.keys(st.used_benefits || {}).forEach(function(b){
          st.used_benefits[b] = keepYear ? {amount_year: st.used_benefits[b].amount_year || 0} : {};
        });
      });
      profile.history = [];
      changed = true;
    } else if (profile.usage_day && profile.usage_day !== day){
      Object.keys(profile.cards).forEach(function(id){
        var ub = profile.cards[id].used_benefits || {};
        Object.keys(ub).forEach(function(b){ ub[b].count_today = 0; });
      });
      changed = true;
    }
    if (profile.usage_month !== month || profile.usage_day !== day) changed = true;
    profile.usage_month = month; profile.usage_day = day;
    profile.history = profile.history || [];

  }
  function applyUsage(id, usage, sign){
    var st = cardState(id);
    st.used_groups = st.used_groups || {}; st.used_benefits = st.used_benefits || {};
    Object.keys(usage.used_groups || {}).forEach(function(g){
      st.used_groups[g] = Math.max(0, (st.used_groups[g] || 0) + sign * usage.used_groups[g]);
    });
    Object.keys(usage.used_benefits || {}).forEach(function(b){
      var cur = st.used_benefits[b] = st.used_benefits[b] || {}, d = usage.used_benefits[b];
      Object.keys(d).forEach(function(k){ cur[k] = Math.max(0, (cur[k] || 0) + sign * d[k]); });
    });
  }
  function recordUse(r, tx){
    rollover();
    var entry = {id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), day: profile.usage_day,
                 card_id: r.card_id, card_name: r.card_name, tx: tx, value: r.value, unit: r.unit, usage: r.usage};
    applyUsage(r.card_id, r.usage, 1);

  }
  var rowResets = {};   // 기록 id → 그 결과 카드의 '썼나요?' 줄을 처음 상태로 돌리는 함수

    if (rowResets[entryId]) { rowResets[entryId](); delete rowResets[entryId]; }

      Object.keys(u.used_benefits || {}).forEach(function(b){ delete u.used_benefits[b].count_today; });

      var b = el('button', null, x[1]); b.type = 'button'; b.title = x[2];
      b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', link === x[0] ? 'true' : 'false');
      b.addEventListener('click', function(){
        link = x[0];
        try { localStorage.setItem(LINK, link); } catch(e){}
        renderLink(); input.focus();
      });
      box.appendChild(b);
    });
  }
  renderLink();

  function send(q){
    if (busy || !q) return;
    busy = true; sendBtn.disabled = true;
    rollover();
    bubble(q, 'user');
    var pending = bubble('계산 중...', 'bot typing');
    fetch('/api/ask', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({q: q, profile: profile, context: context, link: link})
    })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.error){ pending.className = 'msg bot error'; pending.textContent = d.error; return; }
        if (d.context) context = d.context;
        renderAnswer(pending, d);
      })
      .catch(function(){
        pending.className = 'msg bot error';
        pending.textContent = '서버에 연결할 수 없어요. server.py가 실행 중인지 확인해 주세요.';
      })
      .then(function(){ busy = false; sendBtn.disabled = false; scroll(); input.focus(); });
  }

  document.getElementById('chatForm').addEventListener('submit', function(e){
    e.preventDefault(); var q = input.value.trim(); input.value = ''; send(q);
  });
  var ex = document.getElementById('examples');
  EXAMPLES.forEach(function(x){
    var b = el('button', null, x); b.type = 'button';
    b.addEventListener('click', function(){ send(x); }); ex.appendChild(b);
  });

  fetch('/api/info')
    .then(function(r){ return r.json(); })
    .then(function(d){
      document.getElementById('mode').textContent = d.mode;
      cards = d.cards;
      var ids = cards.map(function(c){ return c.id; });
      profile.owned = (profile.owned || []).filter(function(x){ return ids.indexOf(x) >= 0; });
      rollover();
      if (!profile.prefilled) fillFull(); else renderCards();
      renderHistory();
    })
    .catch(function(){ document.getElementById('mode').textContent = '서버 연결 안 됨'; });
  input.focus();
})();
</script>
</body>
</html>
