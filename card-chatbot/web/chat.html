<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카드 혜택 계산기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#F5F6F1;
    --surface:#FFFFFF;
    --surface-2:#EEF1EA;
    --ink:#12201B;
    --ink-soft:#4B5A53;
    --ink-faint:#66736B;
    --accent:#2F6F4E;
    --accent-strong:#1F5038;
    --accent-ink:#FFFFFF;
    --accent-soft:#E2EEE6;
    --accent-line:#B9D3C2;
    --gold:#8A6416;
    --gold-soft:#F6EDD6;
    --ok:#2F6F4E;
    --danger:#B84A3E;
    --danger-soft:#F6E3E0;
    --line:#DDE3D9;
    --track:#DDE3D9;
    --shadow: 0 1px 2px rgba(18,32,27,0.04), 0 12px 32px -16px rgba(18,32,27,0.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1613; --surface:#161F1A; --surface-2:#1D2721;
      --ink:#EAF0EC; --ink-soft:#A9B6AF; --ink-faint:#8A978F;
      --accent:#6FCF9A; --accent-strong:#8CDBAE; --accent-ink:#0F1613; --accent-soft:#1F3328; --accent-line:#2F5A43;
      --gold:#E3B95C; --gold-soft:#3A3020;
      --ok:#6FCF9A; --danger:#E08578; --danger-soft:#3A2321; --line:#293630; --track:#2C3A33;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 20px 40px -20px rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1613; --surface:#161F1A; --surface-2:#1D2721;
    --ink:#EAF0EC; --ink-soft:#A9B6AF; --ink-faint:#8A978F;
    --accent:#6FCF9A; --accent-strong:#8CDBAE; --accent-ink:#0F1613; --accent-soft:#1F3328; --accent-line:#2F5A43;
    --gold:#E3B95C; --gold-soft:#3A3020;
    --ok:#6FCF9A; --danger:#E08578; --danger-soft:#3A2321; --line:#293630; --track:#2C3A33;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 20px 40px -20px rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans KR', -apple-system, sans-serif; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums;}
  button, input, select{font-family:inherit;}
  button{cursor:pointer;}
  input:focus-visible, select:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ---------- 상단 ---------- */
  .top{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:14px 28px;
    background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .logo{width:32px; height:32px; border-radius:9px; background:var(--accent); display:grid; place-items:center; color:var(--accent-ink);}
  .top h1{font-size:19px; margin:0; font-weight:700; white-space:nowrap;}
  .chip{
    white-space:nowrap; font-size:12px; color:var(--ink-soft);
    background:var(--surface-2); border:1px solid var(--line); padding:3px 10px; border-radius:999px;
  }
  .spacer{flex:1;}
  .btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:10px; padding:8px 14px; min-height:42px; font-size:14px; white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);}
  .btn .n{font-family:'IBM Plex Mono'; font-size:12px; margin-left:4px; color:var(--accent-strong);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
  .btn.primary:hover{background:var(--accent-strong);}
  .btn.small{min-height:36px; padding:4px 12px; font-size:13px;}

  /* ---------- 본문 배치 ---------- */
  .layout{max-width:1240px; margin:0 auto; padding:24px 24px 56px; display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start;}
  .main{flex:999 1 560px; min-width:0; display:flex; flex-direction:column; gap:18px;}
  .side{flex:1 1 300px; min-width:0; display:flex; flex-direction:column; gap:16px; position:sticky; top:86px;}
  .box{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow);}

  /* ---------- 대화창 ---------- */
  .chat{display:flex; flex-direction:column; height:calc(100vh - 118px); min-height:560px; overflow:hidden;}
  #log{flex:1; overflow-y:auto; padding:22px 22px 12px; display:flex; flex-direction:column; gap:18px;}
  .u-msg{
    align-self:flex-end; max-width:78%; background:var(--accent); color:var(--accent-ink);
    padding:9px 15px; border-radius:16px 16px 4px 16px; font-size:15px; white-space:pre-wrap; word-break:break-word;
  }
  .b-msg{align-self:stretch; display:flex; gap:10px; align-items:flex-start;}
  .avatar{
    flex:none; width:34px; height:34px; border-radius:50%; background:var(--accent-soft); color:var(--accent-strong);
    display:grid; place-items:center; border:1px solid var(--accent-line);
  }
  .b-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:10px; max-width:760px;}
  .b-say{
    align-self:flex-start; max-width:100%; background:var(--surface-2); border:1px solid var(--line);
    padding:10px 15px; border-radius:4px 16px 16px 16px; font-size:15px; white-space:pre-wrap; word-break:break-word;
  }
  .b-say b{color:var(--accent-strong);}
  .b-tag{font-size:12px; color:var(--ink-soft);}
  .composer{border-top:1px solid var(--line); padding:12px 18px 16px; display:flex; flex-direction:column; gap:10px; background:var(--surface);}
  .composer-top{display:flex; flex-wrap:wrap; align-items:center; gap:8px;}
  .ask-row{display:flex; gap:10px;}
  #q{
    flex:1 1 auto; min-width:0; font-size:16px; padding:12px 15px; border-radius:12px;
    border:2px solid var(--accent); background:var(--surface); color:var(--ink);
  }
  #q:focus{outline:none; box-shadow:0 0 0 3px var(--accent-soft);}
  .send{min-height:50px; padding:0 22px; font-size:16px; border-radius:12px;}
  .send:disabled{opacity:.55; cursor:default;}
  .places{display:flex; flex-wrap:wrap; align-items:center; gap:6px; flex:1 1 360px;}
  .places .label{font-size:12.5px; color:var(--ink-soft); margin-right:2px;}
  .pill{
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    border-radius:999px; padding:5px 12px; min-height:36px; font-size:13px;
  }
  .pill:hover{border-color:var(--accent);}
  .link{display:flex; align-items:center; gap:8px; margin-left:auto;}
  .link .label{font-size:12px; color:var(--ink-soft);}
  .seg{display:flex; padding:2px; border-radius:9px; background:var(--surface-2); border:1px solid var(--line);}
  .seg button{border:none; background:transparent; color:var(--ink-soft); padding:5px 10px; border-radius:7px; font-size:12.5px; white-space:nowrap; min-height:32px;}
  .seg button[aria-checked="true"]{background:var(--surface); color:var(--accent-strong); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,0.12);}

  /* ---------- 답변 ---------- */
  .tag{font-size:11.5px; color:var(--accent-strong); background:var(--accent-soft); border-radius:6px; padding:1px 7px;}
  .slots{display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
  .slots .label{font-size:12.5px; color:var(--ink-soft);}
  .slot{font-size:13px; border:1px solid var(--accent-line); background:var(--accent-soft); color:var(--accent-strong); border-radius:8px; padding:3px 9px;}
  .slot b{font-weight:600; margin-left:3px;}
  .fix{font-size:12.5px; color:var(--accent-strong); background:none; border:none; padding:4px 2px; text-decoration:underline; text-underline-offset:2px;}
  .loading{color:var(--ink-faint); font-size:14px; padding:6px 2px;}
  .error{color:var(--danger); font-size:14px;}

  /* 결론 카드 */
  .hero{border:2px solid var(--accent); border-radius:18px; background:var(--surface); padding:18px 20px; display:flex; flex-direction:column; gap:14px;}
  .badges{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .badge{font-size:12px; font-weight:700; color:var(--accent-ink); background:var(--accent); padding:3px 10px; border-radius:999px;}
  .type{display:inline-block; font-size:11px; font-weight:600; padding:1px 7px; border-radius:6px; vertical-align:2px;}
  .type.check{color:var(--accent-strong); background:var(--accent-soft);}
  .type.credit{color:var(--gold); background:var(--gold-soft);}
  .hero-main{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 20px;}
  .hero-name{font-size:21px; font-weight:700;}
  .hero-benefit{font-size:14.5px; color:var(--ink-soft);}
  .hero-amount{text-align:right;}
  .hero-amount .cap{font-size:12.5px; color:var(--ink-soft);}
  .hero-amount .num{font-family:'IBM Plex Mono', monospace; font-size:36px; font-weight:600; color:var(--accent); line-height:1.1;}
  .meters{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px;}
  .meter{background:var(--bg); border-radius:12px; padding:10px 13px;}
  .meter .k{font-size:12px; color:var(--ink-soft);}
  .meter .v{font-size:14px; font-weight:600;}
  .bar{height:8px; border-radius:999px; background:var(--track); margin-top:7px; overflow:hidden;}
  .bar span{display:block; height:100%; border-radius:999px; background:var(--accent);}
  .bar.gold span{background:var(--gold);}
  .actions{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .actions .btn{min-height:46px; font-size:15px;}
  .done{color:var(--accent-strong); font-weight:600; font-size:14px;}
  .hint{flex-basis:100%; font-size:12.5px; color:var(--ink-soft);}
  .why{border-top:1px dashed var(--line); padding-top:14px; display:flex; flex-direction:column; gap:10px;}
  .why h4{font-size:13.5px; margin:0;}
  .steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px;}
  .steps li{display:grid; grid-template-columns:20px 116px minmax(0, 1fr); gap:8px; font-size:13.5px; align-items:baseline;}
  .steps .mark{font-weight:700; text-align:center;}
  .steps .mark.ok{color:var(--ok);}
  .steps .mark.no{color:var(--danger);}
  .steps .mark.info{color:var(--ink-faint);}
  .steps .label{color:var(--ink-soft);}
  .steps .src{display:block; font-size:11.5px; color:var(--ink-faint);}
  .src-line{font-size:12.5px; color:var(--ink-soft);}
  details.more summary{font-size:13px; color:var(--accent-strong); cursor:pointer;}
  details.more .sub{font-size:13px; font-weight:600; margin:10px 0 4px;}

  /* 다른 선택 */
  .others{display:flex; flex-direction:column; gap:8px;}
  .others h3, .section-title{font-size:13.5px; margin:0; color:var(--ink-soft); font-weight:600;}
  .row{border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:12px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px;}
  .row .rank{font-family:'IBM Plex Mono'; font-size:13px; color:var(--ink-soft); width:18px;}
  .row .who{flex:1 1 220px; min-width:0;}
  .row .who b{font-size:15px;}
  .row .who div{font-size:13px; color:var(--ink-soft);}
  .row .amt{font-family:'IBM Plex Mono', monospace; font-size:18px; font-weight:600;}
  .row .amt.zero{color:var(--ink-faint); font-size:15px;}
  .row .use{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

  /* 안내 상자 */
  .tip{background:var(--gold-soft); border-radius:14px; padding:13px 16px; display:flex; gap:12px; align-items:flex-start; font-size:14px;}
  .tip svg{flex:none; color:var(--gold); margin-top:2px;}
  .tip b{color:var(--gold);}
  .tip ul{margin:2px 0 0; padding-left:18px;}
  .plain{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 20px; font-size:14.5px; white-space:pre-wrap; word-break:break-word;}
  .ask-back{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 20px; display:flex; flex-direction:column; gap:12px;}
  .ask-back .say{font-size:16px; font-weight:600;}
  .choices{display:flex; flex-wrap:wrap; gap:8px;}
  .brand-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px;}
  .brand-btn{text-align:left; border:2px solid var(--accent); background:var(--surface); color:var(--ink); border-radius:12px; padding:11px 14px; min-height:60px;}
  .brand-btn b{display:block; font-size:15px;}
  .brand-btn span{font-size:13px; color:var(--accent-strong);}
  .none{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 20px; display:flex; flex-direction:column; gap:10px;}
  .none .say{font-size:16px; font-weight:600;}
  .reasons{display:grid; grid-template-columns:20px minmax(0, 1fr); gap:6px 8px; font-size:14px; align-items:baseline;}
  .reasons .x{color:var(--danger); font-weight:700;}
  .meta{font-size:12px; color:var(--ink-faint);}
  .none .k, .ask-back .k{font-size:13px; font-weight:600; color:var(--ink-soft);}


  /* ---------- 오른쪽: 이번 달 현황 · 기록 ---------- */
  .side-box{padding:18px 20px; display:flex; flex-direction:column; gap:14px;}
  .side-box h2{font-size:15.5px; margin:0;}
  .side-toggle{
    width:100%; display:flex; align-items:center; gap:8px; border:none; background:transparent; color:var(--ink);
    font:inherit; font-size:15.5px; font-weight:700; padding:4px 0; min-height:40px; text-align:left;
  }
  .side-toggle small{margin-left:auto; font-size:12px; font-weight:500; color:var(--ink-soft);}
  .side-toggle .arrow{display:inline-block; color:var(--ink-soft); transition:transform .15s ease;}
  .side-toggle[aria-expanded="false"] .arrow{transform:rotate(-90deg);}
  .side-box.folded{gap:0;}
  .side-body{display:flex; flex-direction:column; gap:14px;}
  .stat{display:flex; flex-direction:column; gap:6px;}
  .stat-head{display:flex; justify-content:space-between; gap:8px; font-size:14px;}
  .stat-head span{color:var(--ink-soft); font-size:13px; text-align:right;}
  .stat .k{font-size:12.5px; color:var(--ink-soft);}
  .note{font-size:12px; color:var(--ink-soft); margin:0;}
  .hist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .hist li{display:flex; align-items:center; gap:8px; font-size:13px;}
  .hist li .what{flex:1; min-width:0;}
  .hist li .what b{font-weight:600;}
  .hist li .val{font-family:'IBM Plex Mono'; font-weight:600;}
  .hist li button{border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); border-radius:8px; padding:3px 9px; font-size:12px; min-height:30px;}
  .hist li button:hover{color:var(--danger); border-color:var(--danger);}

  /* ---------- 내 카드 서랍 ---------- */
  .drawer{position:fixed; inset:0; z-index:20; display:none;}
  .drawer.open{display:block;}
  .scrim{position:absolute; inset:0; background:rgba(10,18,14,0.45);}
  .sheet{
    position:absolute; top:0; right:0; bottom:0; width:min(420px, 100%); background:var(--surface);
    display:flex; flex-direction:column; box-shadow:-20px 0 40px -20px rgba(0,0,0,0.4);
  }
  .sheet-head{padding:16px 18px 12px; border-bottom:1px solid var(--line);}
  .sheet-title{display:flex; align-items:center; gap:8px;}
  .sheet-title h2{font-size:16px; margin:0;}
  .close{margin-left:auto; min-height:40px; min-width:40px; padding:0;}
  .sheet-head p{font-size:12.5px; color:var(--ink-soft); margin:6px 0 0;}
  .fill-btn{margin-top:8px;}
  .quick{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:10px;}
  .quick-label{font-size:12px; color:var(--ink-soft); margin-right:2px;}
  .quick button{border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); border-radius:999px; padding:4px 10px; font-size:12px; white-space:nowrap; min-height:32px;}
  .quick button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong); font-weight:600;}
  .tabs{display:flex; gap:3px; margin-top:10px; padding:3px; border-radius:9px; background:var(--surface-2); border:1px solid var(--line);}
  .tabs button{flex:1; border:none; background:transparent; color:var(--ink-soft); padding:6px 4px; border-radius:7px; font-size:12.5px; white-space:nowrap;}
  .tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,0.12);}
  .tabs .n{font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-faint); margin-left:3px;}
  .card-list{overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .group-head{display:flex; align-items:center; gap:6px; margin:6px 2px 0; font-size:12px; font-weight:600; color:var(--ink-soft);}
  .group-head .count{font-weight:500; color:var(--ink-faint);}
  .mycard{border:1px solid var(--line); border-radius:12px; background:var(--surface);}
  .mycard.on{border-color:var(--accent); background:var(--accent-soft);}
  .mycard-head{display:flex; align-items:flex-start; gap:10px; padding:10px 12px 8px;}
  .mycard-pick{display:flex; padding:2px 0; cursor:pointer;}
  .mycard-pick input{margin:0; width:18px; height:18px; accent-color:var(--accent); cursor:pointer;}
  .mycard-info{flex:1; min-width:0; cursor:pointer;}
  .mycard-name{font-size:13.5px; font-weight:600;}
  .mycard-sub{font-size:11.5px; color:var(--ink-soft);}
  .mycard-summary{font-size:11.5px; color:var(--ink-soft); margin-top:4px; font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums;}
  .mycard-body{padding:4px 12px 12px 40px; display:none; flex-direction:column; gap:8px;}
  .mycard.open .mycard-body{display:flex;}
  .expand-btn{display:flex; align-items:center; justify-content:center; gap:5px; width:100%; border:none; border-top:1px solid var(--line); background:transparent; color:var(--ink-soft); font-size:12px; padding:6px 10px; border-radius:0 0 11px 11px; min-height:34px;}
  .expand-btn .arrow{display:inline-block; transition:transform .15s ease;}
  .mycard.open .expand-btn .arrow{transform:rotate(180deg);}
  .field{display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--ink-soft);}
  .field.inline{flex-direction:row; align-items:center; gap:6px;}
  .num{display:flex; align-items:center; gap:5px;}
  .num input, .field select{width:100%; padding:6px 8px; border-radius:7px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:13px;}
  .num input{font-family:'IBM Plex Mono'; text-align:right;}
  .num span{font-size:12px; color:var(--ink-soft); white-space:nowrap;}
  details.usage{border-top:1px dashed var(--line); padding-top:6px;}
  details.usage summary{font-size:12px; color:var(--ink-soft); cursor:pointer;}
  details.usage .field{margin-top:6px;}

  @media (max-width:860px){
    .top{padding:12px 16px; position:static;}
    .top h1{font-size:17px;}
    .top .chip.privacy{display:none;}
    .layout{padding:16px 16px 40px;}
    .side{position:static;}
    .link{margin-left:0;}
    .chat{height:auto; min-height:78vh; max-height:none;}
    #log{padding:16px 14px 10px; max-height:70vh;}
    .composer{padding:10px 12px 12px;}
    .places{flex-wrap:nowrap; overflow-x:auto; flex-basis:100%; padding-bottom:2px;}
    .places .pill{flex:none;}
    .u-msg{max-width:88%;}
    .avatar{display:none;}
    .hero{padding:18px;}
    .hero-amount{text-align:left;}
    .hero-amount .num{font-size:34px;}
    .steps li{grid-template-columns:20px 92px minmax(0, 1fr);}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg>
    </div>
    <h1>카드 혜택 계산기</h1>
  </div>
  <span class="chip" id="mode">연결 중</span>
  <span class="spacer"></span>
  <span class="chip privacy">기록은 이 기기에만 저장돼요</span>
  <button class="btn" id="cardsBtn" type="button" aria-controls="drawer" aria-expanded="false">내 카드<span class="n" id="ownedCountTop"></span></button>
  <button class="btn" id="histBtn" type="button">이번 달 기록<span class="n" id="histCount">0건</span></button>
  <button class="btn" id="themeBtn" type="button" aria-label="테마 바꾸기">테마</button>
</header>

<div class="layout">
  <main class="main box chat">
    <div id="log" aria-live="polite"></div>
    <form class="composer" id="chatForm">
      <div class="composer-top">
        <div class="places" id="places"><span class="label">자주 가는 곳</span></div>
        <div class="link">
          <span class="label" id="linkLabel">질문 연결</span>
          <div class="seg" id="linkOpts" role="radiogroup" aria-labelledby="linkLabel"></div>
        </div>
      </div>
      <div class="ask-row">
        <label for="q" class="sr-only">질문</label>
        <input type="text" id="q" placeholder="어디서 얼마 쓰세요? 예) 오후 2시 스벅 15000원" autocomplete="off" maxlength="300">
        <button type="submit" class="btn primary send" id="sendBtn">보내기</button>
      </div>
    </form>
  </main>

  <aside class="side">
    <section class="box side-box" id="status" aria-labelledby="statusTitle"></section>
    <section class="box side-box" id="history" aria-labelledby="historyTitle"></section>
  </aside>
</div>

<div class="drawer" id="drawer">
  <div class="scrim" id="scrim"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="sheet-head">
      <div class="sheet-title">
        <h2 id="drawerTitle">내 카드</h2><span class="chip" id="ownedCount">전체</span>
        <button class="btn close" id="drawerClose" type="button" aria-label="내 카드 닫기">✕</button>
      </div>
      <p>가진 카드를 고르면 그 카드들로만 계산해요. 아무것도 고르지 않으면 9장 전체로 계산해요.</p>
      <button class="btn small fill-btn" id="fillBtn" type="button">전월 실적 최고 구간으로 채우기</button>
      <div class="quick" id="quickPick" role="group" aria-label="카드 한 번에 선택"></div>
      <div class="tabs" id="typeTabs" role="tablist" aria-label="카드 종류"></div>
    </div>
    <div class="card-list" id="cardList"></div>
  </section>
</div>

<script>
(function(){
  var STORE = 'card-chatbot-profile-v2', THEME = 'card-chatbot-theme', OPEN = 'card-chatbot-open',
      TAB = 'card-chatbot-tab', LINK = 'card-chatbot-link';
  var EXAMPLES = ['오후 2시 스벅 15000원', '체크카드 중에 편의점 12000원', '토요일 이마트 6만원', '밤 11시 택시 9000원',
                  '주말에 주유소 8만원 50리터', '아파트관리비 실적에 들어가?', '노리 혜택 알려줘'];
  var PLACES = ['스타벅스', 'GS25', '편의점', '지하철', '택시', '주유소', '이마트'];
  var ASK_PLACES = ['스타벅스', '편의점', '음식점', '카페', '주유소', '지하철'];
  var log = document.getElementById('log'), input = document.getElementById('q');
  var sendBtn = document.getElementById('sendBtn'), list = document.getElementById('cardList');
  var cards = [], profile = load(), context = null, busy = false;
  var openCards = [];
  try { openCards = JSON.parse(localStorage.getItem(OPEN)) || []; } catch(e){}

  function load(){
    try { return JSON.parse(localStorage.getItem(STORE)) || {owned: [], cards: {}}; }
    catch(e){ return {owned: [], cards: {}}; }
  }
  function save(){ try { localStorage.setItem(STORE, JSON.stringify(profile)); } catch(e){} }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function won(n, unit){ return Number(n || 0).toLocaleString('ko-KR') + (unit || '원'); }
  function metaOf(id){ return cards.filter(function(c){ return c.id === id; })[0]; }
  function cardState(id){
    profile.cards[id] = profile.cards[id] || {prev_month: fullOf(id), options: {}, used_groups: {}, used_benefits: {}};
    return profile.cards[id];
  }
  function fullOf(id){ var c = metaOf(id); return c ? c.full_prev_month : 0; }
  function fillFull(){
    cards.forEach(function(c){ cardState(c.id).prev_month = c.full_prev_month; });
    profile.prefilled = true; save(); renderCards(); renderStatus();
  }
  function typeBadge(type){ return el('span', 'type ' + (type === '체크' ? 'check' : 'credit'), type); }

  // ---------- 테마 ----------
  var root = document.documentElement;
  try { var t = localStorage.getItem(THEME); if (t) root.setAttribute('data-theme', t); } catch(e){}
  document.getElementById('themeBtn').addEventListener('click', function(){
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
    try { localStorage.setItem(THEME, dark ? 'light' : 'dark'); } catch(e){}
  });

  // ---------- 내 카드 서랍 ----------
  var drawer = document.getElementById('drawer'), cardsBtn = document.getElementById('cardsBtn');
  function setDrawer(open){
    drawer.classList.toggle('open', open);
    cardsBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) document.getElementById('drawerClose').focus(); else cardsBtn.focus();
  }
  cardsBtn.addEventListener('click', function(){ setDrawer(true); });
  document.getElementById('drawerClose').addEventListener('click', function(){ setDrawer(false); });
  document.getElementById('scrim').addEventListener('click', function(){ setDrawer(false); });
  drawer.addEventListener('keydown', function(e){ if (e.key === 'Escape') setDrawer(false); });
  document.getElementById('fillBtn').addEventListener('click', fillFull);
  document.getElementById('histBtn').addEventListener('click', function(){
    setSide('history', true);
    document.getElementById('history').scrollIntoView({behavior: 'smooth', block: 'start'});
    var t = document.getElementById('historyTitle'); if (t) t.focus();
  });

  // ---------- 체크/신용 탭 ----------
  var TABS = [['전체', '전체'], ['체크', '체크카드'], ['신용', '신용카드']], activeTab = '전체';
  try { activeTab = localStorage.getItem(TAB) || '전체'; } catch(e){}
  function renderTabs(){
    var box = document.getElementById('typeTabs'); box.innerHTML = '';
    TABS.forEach(function(t){
      var n = cards.filter(function(c){ return t[0] === '전체' || c.type === t[0]; }).length;
      var b = el('button', null, t[1]); b.type = 'button';
      b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', activeTab === t[0] ? 'true' : 'false');
      b.appendChild(el('span', 'n', String(n)));
      b.addEventListener('click', function(){
        activeTab = t[0];
        try { localStorage.setItem(TAB, activeTab); } catch(e){}
        renderCards(); list.scrollTop = 0;
      });
      box.appendChild(b);
    });
  }

  function numField(label, value, unit, onChange){
    var f = el('label', 'field'); f.appendChild(el('span', null, label));
    var w = el('div', 'num'), inp = el('input');
    inp.type = 'text'; inp.inputMode = 'numeric'; inp.placeholder = '0';
    inp.value = value ? Number(value).toLocaleString('ko-KR') : '';
    inp.addEventListener('input', function(){
      var n = parseInt(inp.value.replace(/[^0-9]/g, ''), 10);
      inp.value = isNaN(n) ? '' : n.toLocaleString('ko-KR');
      onChange(isNaN(n) ? 0 : n); save(); renderStatus();
    });
    w.appendChild(inp); w.appendChild(el('span', null, unit)); f.appendChild(w);
    return f;
  }
  function checkField(label, checked, onChange){
    var f = el('label', 'field inline'), c = el('input');
    c.type = 'checkbox'; c.checked = !!checked;
    c.addEventListener('change', function(){ onChange(c.checked); save(); });
    f.appendChild(c); f.appendChild(el('span', null, label));
    return f;
  }

  // 한 번에 선택: 전체 / 체크카드만 / 신용카드만 / 모두 해제
  function idsOf(type){ return cards.filter(function(c){ return !type || c.type === type; }).map(function(c){ return c.id; }); }
  function sameSet(a, b){ return a.length === b.length && a.every(function(x){ return b.indexOf(x) >= 0; }); }
  function renderQuick(){
    var box = document.getElementById('quickPick'); box.innerHTML = '';
    box.appendChild(el('span', 'quick-label', '한 번에 선택'));
    [['전체 선택', idsOf(), '전체'], ['체크카드만', idsOf('체크'), '체크'],
     ['신용카드만', idsOf('신용'), '신용'], ['모두 해제', [], '전체']].forEach(function(q){
      var b = el('button', null, q[0]); b.type = 'button';
      b.setAttribute('aria-pressed', sameSet(profile.owned, q[1]) ? 'true' : 'false');
      b.addEventListener('click', function(){
        profile.owned = q[1].slice(); activeTab = q[2];
        try { localStorage.setItem(TAB, activeTab); } catch(e){}
        save(); renderCards(); renderStatus();
      });
      box.appendChild(b);
    });
  }

  function renderCards(){
    list.innerHTML = '';
    renderQuick(); renderTabs();
    (activeTab === '전체' ? ['체크', '신용'] : [activeTab]).forEach(function(type){
      var group = cards.filter(function(c){ return c.type === type; });
      if (!group.length) return;
      var owned = group.filter(function(c){ return profile.owned.indexOf(c.id) >= 0; }).length;
      var h = el('div', 'group-head');
      h.appendChild(typeBadge(type)); h.appendChild(el('span', null, type + '카드'));
      h.appendChild(el('span', 'count', owned + ' / ' + group.length + '장 선택'));
      list.appendChild(h);
      group.forEach(renderCard);
    });
    var count = profile.owned.length ? profile.owned.length + '장' : '전체';
    document.getElementById('ownedCount').textContent = count;
    document.getElementById('ownedCountTop').textContent = profile.owned.length ? profile.owned.length + '장' : '전체 ' + cards.length + '장';
  }

  function summaryText(c, st){
    var parts = [];
    if (c.full_prev_month) parts.push('전월 ' + won(st.prev_month) + (st.prev_month >= c.full_prev_month ? ' · 최고 구간' : ''));
    else parts.push('실적 조건 없음');
    c.options.forEach(function(o){
      var v = (st.options || {})[o.id];
      parts.push(v ? v + (o.id === 'pack' ? '팩' : '') : o.name + ' 미선택');
    });
    if (c.enrollment && st.enrolled) parts.push('프로모션 가입');
    if (st.in_grace) parts.push('신규 특례');
    if (st.overseas_brand === false) parts.push('국내전용');
    var used = Object.values(st.used_groups || {}).some(Boolean) ||
      Object.values(st.used_benefits || {}).some(function(u){ return u && (u.amount || u.count); });
    if (used) parts.push('이번 달 사용 있음');
    return parts.join(' · ');
  }

  function renderCard(c){
    var st = cardState(c.id), on = profile.owned.indexOf(c.id) >= 0, open = openCards.indexOf(c.id) >= 0;
    var box = el('div', 'mycard' + (on ? ' on' : '') + (open ? ' open' : ''));
    var head = el('div', 'mycard-head');
    var pick = el('label', 'mycard-pick'), cb = el('input');
    cb.type = 'checkbox'; cb.checked = on;
    cb.setAttribute('aria-label', c.name + ' 보유 카드로 선택');
    cb.addEventListener('change', function(){
      if (cb.checked) profile.owned.push(c.id);
      else profile.owned = profile.owned.filter(function(x){ return x !== c.id; });
      save(); renderCards(); renderStatus();
    });
    pick.appendChild(cb);
    var info = el('div', 'mycard-info');
    info.appendChild(el('div', 'mycard-name', c.name));
    info.appendChild(el('div', 'mycard-sub', c.issuer + (c.unit === '마일' ? ' · 마일리지' : '')
      + (c.fee ? ' · 연회비 ' + won(c.fee) : ' · 연회비 없음')));
    var summary = el('div', 'mycard-summary', summaryText(c, st));
    info.appendChild(summary);
    function refresh(){ summary.textContent = summaryText(c, st); }
    var btn = el('button', 'expand-btn'); btn.type = 'button';
    function setOpen(v){
      open = v; box.classList.toggle('open', v);
      btn.firstChild.textContent = v ? '접기' : '실적·옵션 설정';
      btn.setAttribute('aria-expanded', v ? 'true' : 'false');
      openCards = openCards.filter(function(x){ return x !== c.id; });
      if (v) openCards.push(c.id);
      try { localStorage.setItem(OPEN, JSON.stringify(openCards)); } catch(e){}
    }
    btn.appendChild(el('span', null, '')); btn.appendChild(el('span', 'arrow', '▾'));
    btn.addEventListener('click', function(){ setOpen(!open); });
    info.addEventListener('click', function(){ setOpen(!open); });
    head.appendChild(pick); head.appendChild(info); box.appendChild(head);

    var body = el('div', 'mycard-body');
    if (c.full_prev_month) body.appendChild(numField('전월 실적 (최고 구간 ' + won(c.full_prev_month) + ')', st.prev_month, '원',
      function(v){ st.prev_month = v; refresh(); }));
    c.options.forEach(function(o){
      var f = el('label', 'field'); f.appendChild(el('span', null, o.name));
      var s = el('select'); s.appendChild(new Option('선택 안 함', ''));
      o.choices.forEach(function(ch){ s.appendChild(new Option(ch, ch)); });
      s.value = (st.options || {})[o.id] || '';
      s.addEventListener('change', function(){ st.options = st.options || {}; st.options[o.id] = s.value; save(); refresh(); });
      f.appendChild(s); body.appendChild(f);
    });
    if (c.enrollment) body.appendChild(checkField(c.enrollment + ' 완료', st.enrolled, function(v){ st.enrolled = v; refresh(); }));
    if (c.has_grace) body.appendChild(checkField('신규 발급 특례 기간', st.in_grace, function(v){ st.in_grace = v; refresh(); }));
    if (c.overseas_brand) body.appendChild(checkField('국내전용 카드 (해외겸용 아님)', st.overseas_brand === false,
      function(v){ st.overseas_brand = !v; refresh(); }));
    if (c.groups.length || c.counted.length || c.capped.length){
      var d = el('details', 'usage'); d.appendChild(el('summary', null, '이번 달 이미 받은 혜택 (직접 입력)'));
      c.groups.forEach(function(g){
        d.appendChild(numField(g.name + (g.kind === '이용금액' ? ' (사용한 이용금액)' : ' (받은 금액)'),
          (st.used_groups || {})[g.id], g.unit, function(v){ st.used_groups = st.used_groups || {}; st.used_groups[g.id] = v; refresh(); }));
      });
      c.capped.forEach(function(b){
        var ub = (st.used_benefits = st.used_benefits || {});
        d.appendChild(numField(b.name + ' 받은 금액 (월 ' + won(b.per_month, c.unit === '마일' ? '마일' : '원') + ')',
          (ub[b.id] || {}).amount, '원', function(v){ ub[b.id] = ub[b.id] || {}; ub[b.id].amount = v; refresh(); }));
      });
      c.counted.forEach(function(b){
        var ub = (st.used_benefits = st.used_benefits || {});
        d.appendChild(numField(b.name + ' 사용 횟수 (월 ' + b.per_month + '회)', (ub[b.id] || {}).count, '회',
          function(v){ ub[b.id] = ub[b.id] || {}; ub[b.id].count = v; refresh(); }));
      });
      body.appendChild(d);
    }
    box.appendChild(body); box.appendChild(btn); setOpen(open);
    list.appendChild(box);
  }

  // ---------- 사용 기록: '썼어요'를 누르면 서버(엔진)가 계산해 준 사용량을 그대로 더해요 ----------
  function ymd(d){ var z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
  function rollover(){
    // 달이 바뀌면 이번 달 사용량을, 날이 바뀌면 오늘 횟수를 0으로 (처음 쓰는 경우엔 기존 입력값을 지우지 않아요)
    var day = ymd(new Date()), month = day.slice(0, 7), changed = false;
    if (profile.usage_month && profile.usage_month !== month){
      var keepYear = profile.usage_month.slice(0, 4) === month.slice(0, 4);
      Object.keys(profile.cards).forEach(function(id){
        var st = profile.cards[id];
        st.used_groups = {};
        Object.keys(st.used_benefits || {}).forEach(function(b){
          st.used_benefits[b] = keepYear ? {amount_year: st.used_benefits[b].amount_year || 0} : {};
        });
      });
      profile.history = []; changed = true;
    } else if (profile.usage_day && profile.usage_day !== day){
      Object.keys(profile.cards).forEach(function(id){
        var ub = profile.cards[id].used_benefits || {};
        Object.keys(ub).forEach(function(b){ ub[b].count_today = 0; });
      });
      changed = true;
    }
    if (profile.usage_month !== month || profile.usage_day !== day) changed = true;
    profile.usage_month = month; profile.usage_day = day;
    profile.history = profile.history || [];
    if (changed) save();
  }
  function applyUsage(id, usage, sign){
    var st = cardState(id);
    st.used_groups = st.used_groups || {}; st.used_benefits = st.used_benefits || {};
    Object.keys(usage.used_groups || {}).forEach(function(g){
      st.used_groups[g] = Math.max(0, (st.used_groups[g] || 0) + sign * usage.used_groups[g]);
    });
    Object.keys(usage.used_benefits || {}).forEach(function(b){
      var cur = st.used_benefits[b] = st.used_benefits[b] || {}, d = usage.used_benefits[b];
      Object.keys(d).forEach(function(k){ cur[k] = Math.max(0, (cur[k] || 0) + sign * d[k]); });
    });
  }
  function recordUse(r, v){
    rollover();
    var entry = {id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), day: profile.usage_day,
                 card_id: r.card_id, card_name: r.card_name, tx: v.tx, amount: v.amount || 0,
                 value: r.value, unit: r.unit, usage: r.usage};
    applyUsage(r.card_id, r.usage, 1);
    profile.history.unshift(entry);
    save(); renderCards(); renderHistory(); renderStatus();
    return entry.id;
  }
  var rowResets = {};   // 기록 id → 그 결과의 '썼나요?' 줄을 처음 상태로 돌리는 함수
  function undoUse(entryId){
    var e = (profile.history || []).filter(function(x){ return x.id === entryId; })[0];
    if (rowResets[entryId]) { rowResets[entryId](); delete rowResets[entryId]; }
    if (!e) return;
    var u = JSON.parse(JSON.stringify(e.usage));
    if (e.day !== profile.usage_day)   // 지난 날 기록이면 오늘 횟수는 이미 0이라 월 사용량만 되돌려요
      Object.keys(u.used_benefits || {}).forEach(function(b){ delete u.used_benefits[b].count_today; });
    applyUsage(e.card_id, u, -1);
    profile.history = profile.history.filter(function(x){ return x.id !== entryId; });
    save(); renderCards(); renderHistory(); renderStatus();
  }

  // 오른쪽 칸 접고 펴기 (이 브라우저에 기억)
  var SIDE = 'card-chatbot-side', sideOpen = {};
  try { sideOpen = JSON.parse(localStorage.getItem(SIDE)) || {}; } catch(e){}
  function sideHead(box, key, title, small){
    var open = sideOpen[key] !== false;
    box.classList.toggle('folded', !open);
    var h = el('h2'), b = el('button', 'side-toggle'); b.type = 'button'; b.id = key + 'Title';
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
    b.setAttribute('aria-controls', key + 'Body');
    b.appendChild(el('span', 'arrow', '▾')); b.appendChild(el('span', null, title)); b.appendChild(el('small', null, small));
    var body = el('div', 'side-body'); body.id = key + 'Body'; body.hidden = !open;
    b.addEventListener('click', function(){ setSide(key, body.hidden); });
    h.appendChild(b); box.appendChild(h); box.appendChild(body);
    return body;
  }
  function setSide(key, open){
    sideOpen[key] = open;
    try { localStorage.setItem(SIDE, JSON.stringify(sideOpen)); } catch(e){}
    var b = document.getElementById(key + 'Title'), body = document.getElementById(key + 'Body');
    if (!b || !body) return;
    b.setAttribute('aria-expanded', open ? 'true' : 'false'); body.hidden = !open;
    b.closest('.side-box').classList.toggle('folded', !open);
  }

  function renderHistory(){
    var box = document.getElementById('history'); box.innerHTML = '';
    var hist = profile.history || [];
    document.getElementById('histCount').textContent = hist.length + '건';
    box = sideHead(box, 'history', '이번 달 결제 기록', hist.length + '건');
    if (!hist.length){
      box.appendChild(el('p', 'note', '결과에서 "이 카드로 결제했어요"를 누르면 여기에 남고, 그만큼 남은 한도·횟수에서 빠져요.'));
      return;
    }
    var ul = el('ul', 'hist');
    hist.forEach(function(e){
      var li = el('li'), what = el('span', 'what');
      what.appendChild(el('b', null, e.card_name.replace(/^(KB국민|신한카드|롯데카드|NH농협|삼성카드) /, '')));
      what.appendChild(document.createTextNode(' · ' + e.tx.split(', ')[0] + ' · ' + e.day.slice(5).replace('-', '/')));
      li.appendChild(what);
      li.appendChild(el('span', 'val', won(e.value, e.unit)));
      var b = el('button', null, '되돌리기'); b.type = 'button';
      b.setAttribute('aria-label', e.card_name + ' ' + e.tx + ' 기록 되돌리기');
      b.addEventListener('click', function(){ undoUse(e.id); });
      li.appendChild(b); ul.appendChild(li);
    });
    box.appendChild(ul);
    box.appendChild(el('p', 'note', '직접 기록한 결제 기준이에요. 실제 카드사 집계와 다를 수 있어요.'));
  }

  // ---------- 이번 달 현황 ----------
  function tierOf(c, prev){
    var best = null;
    (c.tiers || []).forEach(function(t){ if (prev >= t.min) best = t.id; });
    return best;
  }
  function meterEl(label, valueText, ratio, gold){
    var m = el('div', 'stat');
    var k = el('div', 'stat-head'); k.appendChild(el('span', 'k', label)); m.appendChild(k);
    k.firstChild.style.color = 'inherit';
    var v = el('div', 'k', valueText); m.appendChild(v);
    if (ratio != null){
      var bar = el('div', 'bar' + (gold ? ' gold' : '')), s = el('span');
      s.style.width = Math.max(0, Math.min(100, ratio * 100)).toFixed(0) + '%';
      bar.appendChild(s); m.appendChild(bar);
    }
    return m;
  }
  function renderStatus(){
    var box = document.getElementById('status'); box.innerHTML = '';
    var month = (profile.usage_month || ymd(new Date()).slice(0, 7)).slice(5).replace(/^0/, '') + '월';
    var head = box;
    box = sideHead(head, 'status', '이번 달 현황', month);
    var ids = profile.owned.length ? profile.owned : cards.map(function(c){ return c.id; });
    var hist = profile.history || [], shown = 0;
    ids.forEach(function(id){
      var c = metaOf(id); if (!c) return;
      var st = cardState(id), spent = 0, n = 0;
      hist.forEach(function(e){ if (e.card_id === id){ spent += e.amount || 0; n++; } });
      var rows = [];
      var tier = tierOf(c, st.prev_month || 0);
      c.groups.forEach(function(g){
        var used = (st.used_groups || {})[g.id] || 0;
        if (!used) return;
        var limit = g.per_month_by_tier ? g.per_month_by_tier[tier] : g.per_month;
        rows.push(limit ? meterEl(g.name, won(limit, g.unit) + ' 중 ' + won(Math.max(0, limit - used), g.unit) + ' 남음', used / limit)
                        : meterEl(g.name, won(used, g.unit) + ' 사용'));
      });
      c.counted.forEach(function(b){
        var u = ((st.used_benefits || {})[b.id] || {}).count || 0;
        if (u) rows.push(meterEl(b.name, '월 ' + b.per_month + '회 중 ' + Math.max(0, b.per_month - u) + '회 남음', u / b.per_month, true));
      });
      if (!rows.length && !n) return;
      shown++;
      var card = el('div', 'stat');
      var head = el('div', 'stat-head');
      head.appendChild(el('b', null, c.name.replace(/^(KB국민|신한카드|롯데카드|NH농협|삼성카드) /, '')));
      head.appendChild(el('span', null, n ? '기록 ' + n + '건 · ' + won(spent) : ''));
      card.appendChild(head);
      // 다음 달 구간: 이번 달 기록한 결제 합계로 추정
      if (n && (c.tiers || []).length){
        var next = c.tiers.filter(function(t){ return t.min > spent; })[0];
        card.appendChild(el('div', 'k', next ? '다음 달 ' + next.id + ' 구간(' + won(next.min) + ')까지 ' + won(next.min - spent) + ' (기록한 결제 기준)'
                                             : '기록한 결제로 최고 구간 달성'));
      }
      rows.forEach(function(r){ card.appendChild(r); });
      box.appendChild(card);
    });
    if (!shown) box.appendChild(el('p', 'note', '결제를 기록하면 카드별 남은 한도·횟수와 다음 달 실적 구간까지 남은 금액이 여기 보여요.'));
  }

  // ---------- 질문 연결: 자동 / 이어서 / 새 질문 ----------
  var LINKS = [['auto', '자동', '코드가 이어받을지 판단'],
    ['follow', '이어서', '이전 질문의 빈 칸(가맹점·금액·요일 등)을 이어받기'], ['new', '새 질문', '이전 질문을 참고하지 않기']];
  var link = 'auto';
  try { link = localStorage.getItem(LINK) || 'auto'; } catch(e){}
  function renderLink(){
    var box = document.getElementById('linkOpts'); box.innerHTML = '';
    LINKS.forEach(function(x){
      var b = el('button', null, x[1]); b.type = 'button'; b.title = x[2];
      b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', link === x[0] ? 'true' : 'false');
      b.addEventListener('click', function(){
        link = x[0];
        try { localStorage.setItem(LINK, link); } catch(e){}
        renderLink(); input.focus();
      });
      box.appendChild(b);
    });
  }
  renderLink();

  // ---------- 답변 그리기 ----------
  function stepList(steps){
    var ul = el('ul', 'steps');
    steps.forEach(function(s){
      var li = el('li');
      var mark = s.ok === true ? ['ok', '✓'] : s.ok === false ? ['no', '✗'] : ['info', '·'];
      li.appendChild(el('span', 'mark ' + mark[0], mark[1]));
      li.appendChild(el('span', 'label', s.label));
      var d = el('span', null, s.detail);
      if (s.source) d.appendChild(el('span', 'src', '근거 ' + s.source));
      li.appendChild(d); ul.appendChild(li);
    });
    return ul;
  }
  // 계산 단계 중 "월 50,000원 중 47,000원 남음"처럼 남은 한도·횟수를 막대로
  var LEFT = /([\d,]+)(원|마일|회)[^중]*중\s*([\d,]+)(원|마일|회)\s*남음/;
  function meters(r){
    var out = [];
    r.applied.forEach(function(b){
      b.steps.forEach(function(s){
        var m = LEFT.exec(s.detail || '');
        if (!m) return;
        var total = Number(m[1].replace(/,/g, '')), left = Number(m[3].replace(/,/g, ''));
        // '월 2회 중 2회 남음'처럼 기간까지 보이게 계산 단계 문장을 그대로 써요
        out.push({k: s.label, v: s.detail.replace(/\s*\([^)]*구간\)/, ''), ratio: total ? left / total : 0});
      });
    });
    return out.slice(0, 4);
  }
  function why(r){
    if (r.applied.length) return r.applied.map(function(b){ return b.name; }).join(' + ');
    if (r.considered.length){ var c = r.considered[0]; return c.name + ': ' + c.steps[c.steps.length - 1].detail; }
    return r.note || '해당 혜택 없음';
  }
  function shortName(n){ return n.replace(/^(KB국민|신한카드|롯데카드|NH농협|삼성카드) /, ''); }

  function useControls(r, v, big){
    var wrap = el('div', 'actions');
    function ask(){
      wrap.innerHTML = '';
      var yes = el('button', big ? 'btn primary' : 'btn small', big ? '이 카드로 결제했어요' : '썼어요'); yes.type = 'button';
      yes.setAttribute('aria-label', r.card_name + '로 결제했다고 기록');
      yes.addEventListener('click', function(){ var id = recordUse(r, v); rowResets[id] = ask; done(id); });
      wrap.appendChild(yes);
      if (big && whyBtn) wrap.appendChild(whyBtn);
    }
    var whyBtn = null;
    function done(entryId){
      wrap.innerHTML = '';
      var meta = metaOf(r.card_id), parts = [];
      Object.keys(r.usage.used_groups || {}).forEach(function(g){
        var grp = meta && meta.groups.filter(function(x){ return x.id === g; })[0];
        parts.push((grp ? grp.name : g) + ' +' + won(r.usage.used_groups[g], grp ? grp.unit : '원'));
      });
      wrap.appendChild(el('span', 'done', '✓ 기록했어요' + (parts.length ? ' (' + parts.join(', ') + ')' : '')));
      var undo = el('button', 'btn small', '되돌리기'); undo.type = 'button';
      undo.addEventListener('click', function(){ undoUse(entryId); });
      wrap.appendChild(undo);
      if (big && whyBtn) wrap.appendChild(whyBtn);
      if (big) wrap.appendChild(el('span', 'hint', '같은 결제를 다시 물어보면 남은 한도·횟수로 다시 계산해요.'));
    }
    return {el: wrap, ask: ask, setWhy: function(b){ whyBtn = b; }};
  }

  function heroCard(r, v){
    var meta = metaOf(r.card_id);
    var box = el('article', 'hero');
    var badges = el('div', 'badges');
    badges.appendChild(el('span', 'badge', '이 카드로 결제하세요'));
    if (meta) badges.appendChild(typeBadge(meta.type));
    if (v.scope) badges.appendChild(el('span', 'tag', v.scope + ' 비교'));
    box.appendChild(badges);
    var main = el('div', 'hero-main'), left = el('div');
    left.appendChild(el('div', 'hero-name', r.card_name));
    left.appendChild(el('div', 'hero-benefit', why(r)));
    var right = el('div', 'hero-amount');
    right.appendChild(el('div', 'cap', '받는 혜택'));
    right.appendChild(el('div', 'num', won(r.value, r.unit)));
    main.appendChild(left); main.appendChild(right); box.appendChild(main);
    var ms = meters(r);
    if (ms.length){
      var g = el('div', 'meters');
      ms.forEach(function(m){
        var d = el('div', 'meter'); d.appendChild(el('div', 'k', m.k)); d.appendChild(el('div', 'v', m.v));
        var bar = el('div', 'bar'), s = el('span'); s.style.width = Math.round(m.ratio * 100) + '%';
        bar.appendChild(s); d.appendChild(bar); g.appendChild(d);
      });
      box.appendChild(g);
    }
    var detail = el('div', 'why'); detail.hidden = true;
    detail.appendChild(el('h4', null, '계산 근거'));
    r.applied.forEach(function(b){
      if (r.applied.length > 1) detail.appendChild(el('div', 'src-line', b.name + ' → ' + won(b.value, b.unit)));
      detail.appendChild(stepList(b.steps));
      if (b.source) detail.appendChild(el('div', 'src-line', '근거: 상품설명서 ' + b.source));
    });
    var fails = r.considered.filter(function(b){ return b.stop; });
    if (fails.length){
      var d2 = el('details', 'more'); d2.appendChild(el('summary', null, '이 카드의 다른 혜택이 안 된 이유 (' + fails.length + ')'));
      fails.forEach(function(b){ d2.appendChild(el('div', 'sub', b.name)); d2.appendChild(stepList(b.steps)); });
      detail.appendChild(d2);
    }
    var whyBtn = el('button', 'btn', '왜 ' + won(r.value, r.unit) + '인가요?'); whyBtn.type = 'button';
    whyBtn.setAttribute('aria-expanded', 'false');
    whyBtn.addEventListener('click', function(){
      detail.hidden = !detail.hidden; whyBtn.setAttribute('aria-expanded', detail.hidden ? 'false' : 'true');
    });
    if (r.usage && Object.keys(r.usage).length){
      var u = useControls(r, v, true); u.setWhy(whyBtn); u.ask(); box.appendChild(u.el);
    } else {
      var a = el('div', 'actions'); a.appendChild(whyBtn); box.appendChild(a);
    }
    box.appendChild(detail);
    return box;
  }

  function otherRow(r, i, v){
    var meta = metaOf(r.card_id);
    var row = el('div', 'row');
    row.appendChild(el('span', 'rank', String(i + 1)));
    var who = el('div', 'who'), name = el('b', null, r.card_name + ' ');
    if (meta) name.appendChild(typeBadge(meta.type));
    who.appendChild(name); who.appendChild(el('div', null, why(r)));
    row.appendChild(who);
    row.appendChild(el('span', 'amt' + (r.value > 0 ? '' : ' zero'), won(r.value, r.unit)));
    if (r.value > 0 && r.usage && Object.keys(r.usage).length){ var u = useControls(r, v, false); u.ask(); row.appendChild(u.el); }
    return row;
  }

  function tipBox(title, items){
    var t = el('div', 'tip');
    t.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/></svg>';
    var body = el('div'); body.appendChild(el('b', null, title));
    var ul = el('ul'); items.forEach(function(x){ ul.appendChild(el('li', null, x)); });
    body.appendChild(ul); t.appendChild(body);
    return t;
  }

  function slotRow(d, q){
    var row = el('div', 'slots');
    if (!(d.slots || []).length) return null;
    row.appendChild(el('span', 'label', '이렇게 이해했어요'));
    d.slots.forEach(function(s){
      var c = el('span', 'slot', s.label); c.appendChild(el('b', null, s.value)); row.appendChild(c);
    });
    var fix = el('button', 'fix', '질문 고치기'); fix.type = 'button';
    fix.addEventListener('click', function(){ input.value = q; input.focus(); input.select(); });
    row.appendChild(fix);
    return row;
  }

  function eul(word){   // 받침에 따라 을/를
    var ch = word.charCodeAt(word.length - 1);
    return (ch >= 0xAC00 && ch <= 0xD7A3 && (ch - 0xAC00) % 28) ? '을' : '를';
  }
  function sayBenefit(v){
    var res = v.results || [], best = res[0], scope = v.scope ? v.scope.replace(/만$/, '') + ' 중에서는 ' : '';
    if (best && best.value > 0){
      var amt = won(best.value, best.unit);
      return scope + best.card_name + '로 결제하면 ' + amt + eul(amt) + ' 받아요.';
    }
    if ((v.by_brand || []).length) return scope + '이 업종 어디서나 주는 혜택은 없지만, 가게에 따라 받을 수 있어요.';
    return scope + '이번 결제로 받을 수 있는 혜택이 없어요.';
  }

  function renderBenefit(wrap, d){
    var v = d.view, res = v.results || [];
    var best = res[0];
    if (best && best.value > 0){
      wrap.appendChild(heroCard(best, v));
    } else {
      var none = el('div', 'none');
      none.appendChild(el('div', 'k', '카드별로 안 되는 이유'));
      var rs = el('div', 'reasons');
      res.slice(0, 3).forEach(function(r){
        rs.appendChild(el('span', 'x', '✗'));
        rs.appendChild(el('span', null, shortName(r.card_name) + ': ' + why(r)));
      });
      if (res.length) none.appendChild(rs);
      wrap.appendChild(none);
    }
    if ((v.by_brand || []).length){
      var bb = el('div', 'ask-back');
      bb.appendChild(el('div', 'k', '가게에 따라 더 받아요'));
      var grid = el('div', 'brand-grid');
      v.by_brand.forEach(function(x){
        var b = el('button', 'brand-btn'); b.type = 'button';
        b.appendChild(el('b', null, x.brand + '에서 결제하면'));
        b.appendChild(el('span', null, shortName(x.card_name) + ' ' + won(x.value, x.unit)));
        b.addEventListener('click', function(){ send(x.brand, {ctx: d.context, link: 'follow'}); });
        grid.appendChild(b);
      });
      bb.appendChild(grid);
      bb.appendChild(el('div', 'meta', '누르면 같은 금액·조건으로 그 가게를 다시 계산해요'));
      wrap.appendChild(bb);
    }
    var others = res.slice(best && best.value > 0 ? 1 : 3);
    if (best && best.value > 0 && others.length){
      var o = el('div', 'others'); o.appendChild(el('h3', null, '다른 선택'));
      others.forEach(function(r, i){ o.appendChild(otherRow(r, i + 1, v)); });
      wrap.appendChild(o);
    }
    if ((v.suggestions || []).length)
      wrap.appendChild(tipBox('이렇게 하면 더 받아요', v.suggestions.map(function(x){ return shortName(x.card) + ': ' + x.text; })));
    wrap.appendChild(el('div', 'meta', v.tx + ' · ' + (v.scope ? v.scope + ' · ' : '') + '카드 ' + v.compared + '장 비교'));
  }

  function renderAnswer(wrap, d, q){
    var v = d.view || {}, p = (d.context || {}).parsed || {};
    if (v.kind === 'benefit' && v.results){
      wrap.appendChild(el('div', 'b-say', sayBenefit(v)));
      var s = slotRow(d, q); if (s) wrap.appendChild(s);
      return renderBenefit(wrap, d);
    }
    if (p.amount && !p.merchant && !p.overseas && d.answer.indexOf('어디서') >= 0){
      wrap.appendChild(el('div', 'b-say', won(p.amount) + eul(won(p.amount)) + ' 어디서 결제하세요?'));
      var ab = el('div', 'ask-back');
      var ch = el('div', 'choices');
      ASK_PLACES.forEach(function(name){
        var b = el('button', 'pill', name); b.type = 'button';
        b.addEventListener('click', function(){ send(name, {ctx: d.context, link: 'follow'}); });
        ch.appendChild(b);
      });
      ab.appendChild(ch);
      ab.appendChild(el('div', 'meta', '누르면 ' + won(p.amount) + '과 합쳐서 바로 계산해요. 다른 곳이면 입력창에 적어 주세요.'));
      wrap.appendChild(ab);
      return;
    }
    wrap.appendChild(el('div', 'b-say', d.answer));
    var s2 = slotRow(d, q); if (s2) wrap.appendChild(s2);
  }

  var BOT_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg>';
  function botMsg(){
    var m = el('div', 'b-msg'), av = el('div', 'avatar'); av.innerHTML = BOT_ICON;
    var body = el('div', 'b-body');
    m.appendChild(av); m.appendChild(body); log.appendChild(m);
    return body;
  }
  function scrollDown(){ log.scrollTop = log.scrollHeight; }
  function newTurn(q){
    log.appendChild(el('div', 'u-msg', q));
    var body = botMsg();
    var tagLine = el('div', 'b-tag'); tagLine.hidden = true; body.appendChild(tagLine);
    var loading = el('div', 'b-say loading', '계산 중...');
    body.appendChild(loading);
    scrollDown();
    return {body: body, line: tagLine, loading: loading};
  }
  function welcome(){
    var body = botMsg();
    body.appendChild(el('div', 'b-say', '안녕하세요! 어디서 얼마를 쓸지 말해 주시면, 가진 카드 중 가장 이득인 카드와 계산 근거를 알려드려요.'));
    var ch = el('div', 'choices');
    EXAMPLES.forEach(function(x){
      var b = el('button', 'pill', x); b.type = 'button';
      b.addEventListener('click', function(){ send(x); }); ch.appendChild(b);
    });
    body.appendChild(ch);
  }

  function send(q, opts){
    opts = opts || {};
    if (busy || !q) return;
    busy = true; sendBtn.disabled = true;
    rollover();
    var t = newTurn(q);
    var ctx = opts.ctx !== undefined ? opts.ctx : context, mode = opts.link || link;
    fetch('/api/ask', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({q: q, profile: profile, context: ctx, link: mode})
    })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.error){ t.loading.className = 'b-say error'; t.loading.textContent = d.error; return; }
        if (d.context) context = d.context;
        if (d.followup){ t.line.textContent = '↳ 이전 질문에 이어서' + (d.link === 'follow' ? ' (이어서 선택)' : ''); t.line.hidden = false; }
        else if (d.link === 'new'){ t.line.textContent = '새 질문으로 계산'; t.line.hidden = false; }
        t.loading.remove();
        renderAnswer(t.body, d, q);
      })
      .catch(function(){
        t.loading.className = 'b-say error';
        t.loading.textContent = '서버에 연결할 수 없어요. server.py가 실행 중인지 확인해 주세요.';
      })
      .then(function(){ busy = false; sendBtn.disabled = false; scrollDown(); input.focus(); });
  }

  document.getElementById('chatForm').addEventListener('submit', function(e){
    e.preventDefault(); var q = input.value.trim(); input.value = ''; send(q);
  });
  var places = document.getElementById('places');
  PLACES.forEach(function(x){
    var b = el('button', 'pill', x); b.type = 'button';
    b.addEventListener('click', function(){
      input.value = x + ' ' + input.value.replace(new RegExp('^(' + PLACES.join('|') + ')\\s*'), '');
      input.focus(); input.setSelectionRange(input.value.length, input.value.length);
    });
    places.appendChild(b);
  });
  welcome();

  fetch('/api/info')
    .then(function(r){ return r.json(); })
    .then(function(d){
      document.getElementById('mode').textContent = d.mode;
      cards = d.cards;
      var ids = cards.map(function(c){ return c.id; });
      profile.owned = (profile.owned || []).filter(function(x){ return ids.indexOf(x) >= 0; });
      rollover();
      if (!profile.prefilled) fillFull(); else renderCards();
      renderHistory(); renderStatus();
    })
    .catch(function(){ document.getElementById('mode').textContent = '서버 연결 안 됨'; });
  input.focus();
})();
</script>
</body>
</html>
